name: Feature request
description: An idea for an existing mod or a new one
labels: [enhancement]
body:
  - type: input
    id: mod
    attributes:
      label: Mod
      description: Which mod, or "new mod"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like to do and why. Mention any editor or tool that does it well.
    validations:
      required: true
